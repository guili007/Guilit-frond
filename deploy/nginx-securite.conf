# En-têtes de sécurité de guilit.com — à inclure dans le bloc « server » de
# nginx sur le VPS :
#
#     include /etc/nginx/snippets/guilit-securite.conf;
#
# puis : sudo nginx -t && sudo systemctl reload nginx
#
# CSP : les scripts du site sont tous en ligne. Plutôt que 'unsafe-inline'
# (qui laisserait passer n'importe quel script injecté), chaque script est
# autorisé par son empreinte SHA-256. Conséquence à connaître : MODIFIER UN
# SCRIPT CHANGE SON EMPREINTE. Il faut alors régénérer la liste avec
# deploy/csp-empreintes.py, sinon le navigateur bloque ce script.
#
# 'unsafe-inline' reste nécessaire pour les styles : plusieurs pages ont des
# attributs style="…". Risque faible, une feuille de style ne s'exécute pas.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-MoauvJHl3IA4rojcjxgQxHdMWhcnSMT6C+1R23UPoDk=' 'sha256-iXKGKYvcu/SqzV9Vk6OwptbRMAt9FntIIpqJEjyVrrk=' 'sha256-lx5cQMxJjHbhvEbYyee3pAb/yx5rcQPNLPYbzOfjOtU=' 'sha256-vHbLkTA4DExQdb4Th76yLGEH1WNoiwpLTEDfMMA+ISI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Ne pas annoncer la version de nginx.
server_tokens off;

# Fichiers cachés (.git, .env, .claude…) : jamais servis, même s'ils
# finissent un jour dans le dossier publié par erreur.
location ~ /\. {
    deny all;
    return 404;
}
